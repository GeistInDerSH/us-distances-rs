[package]
name = "usdist"
version = "0.1.0"
edition = "2021"

[dev-dependencies]
criterion = "0.5.1"

[dependencies]
kdtree = "0.7.0"

[[bench]]
name = "benchmarks"
harness = false

[profile.dev]
overflow-checks = false
opt-level = 3
debug = "limited"
strip = "none"
debug-assertions = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

[profile.release]
codegen-units = 1
panic = "abort"
debug = "none"
split-debuginfo = "off"
strip = "symbols"
incremental = false
overflow-checks = false
opt-level = 3
debug-assertions = false
lto = "fat"
rpath = false
