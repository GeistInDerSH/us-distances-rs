[package]
name = "usdist"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "run"
path = "src/bin/run.rs"

[dev-dependencies]
criterion = "0.5.1"

[dependencies]
bincode = { version = "2.0.1", features = ["serde"] }
farthest = { path = "./farthest" }

[build-dependencies]
farthest = { path = "./farthest" }
kdtree = { version = "0.7.0", features = ["serialize"] }
bincode = { version = "2.0.1", features = ["serde"] }

[[bench]]
name = "benchmarks"
harness = false

[profile.dev]
overflow-checks = false
opt-level = 3
debug = "limited"
strip = "none"
debug-assertions = false
lto = "fat"
panic = "abort"
incremental = false
codegen-units = 1
rpath = false

[profile.release]
codegen-units = 1
panic = "abort"
debug = "none"
split-debuginfo = "off"
strip = "symbols"
incremental = false
overflow-checks = false
opt-level = 3
debug-assertions = false
lto = "fat"
rpath = false
